name: Exact upstream analytic proof chain
on:
  push:
    branches: [verification/zfr-4331]
permissions:
  contents: read
jobs:
  exact:
    name: Build changed modules and mathematical clients
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_ABORT_ON_PANIC: "1"
      LAKE_ARTIFACT_CACHE: "false"
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
      MODULE: Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.LogDerivBound
      BASE: 2dea99006976a5104032e495d7513dee40fbb5ca
      CANDIDATE: 170cdf7af6cc402774a1a0fde8e2fbcffc07bbab
    steps:
      - name: Obtain fixed project and unchanged source dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL "https://codeload.github.com/YinkaiYu/riemann-hypothesis/tar.gz/$CANDIDATE" | tar -xz --strip-components=1
          grep -Fx 'leanprover/lean4:v4.33.1' lean-toolchain
          test "$(jq -r '.packages[] | select(.name == "mathlib") | .rev' lake-manifest.json)" = 0df444a360eaa60ab8c11dca51a86af692955474
      - name: Install upstream toolchain
        run: |
          set -eu
          curl --retry 4 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Fetch Mathlib's pinned official cache
        run: |
          set -eu
          lake exe mathlib/cache get Mathlib
          df -h .
      - name: Build modified modules and their public clients
        shell: bash
        run: |
          set -eu
          lake build +Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.LogDerivBound:olean +Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.ZeroFactor:olean +Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.LandauLocalOf:olean +Formalism.LandauZeroFreeBounds.ExceptionalZeroBounds.ExistsLocalZeroExpansionOfBound:olean +Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.ThreeFourOne:olean +Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.ZeroFreeOf:olean +Formalism.LandauZeroFreeBounds.ExceptionalZeroBounds.ZetaNegReal:olean +Formalism.SizeWindowBrackets.ChainSlopeWindows.ChiEightNoRealZeroHypothesis:olean +Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.MellinRemainder:olean +Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.ZetaGrowth:olean +Formalism.ZeroFreeRegion.FinalZFR:olean +Formalism.ZeroFreeRegion.LogDerivRegion:olean +Formalism.LandauZeroFreeBounds.ExceptionalZeroBounds.BqGrowth:olean +Formalism.LandauZeroFreeBounds.FinalSiegel:olean +Formalism.SizeWindowBrackets.ChainSlopeWindows.AnalyticFirstToLatticeDiscriminant:olean
      - name: Kernel replay and theorem audit
        shell: bash
        run: |
          set -eu
          for module in Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.LogDerivBound Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.ZeroFactor Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.LandauLocalOf Formalism.LandauZeroFreeBounds.ExceptionalZeroBounds.ExistsLocalZeroExpansionOfBound Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.ThreeFourOne Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.ZeroFreeOf Formalism.LandauZeroFreeBounds.ExceptionalZeroBounds.ZetaNegReal Formalism.SizeWindowBrackets.ChainSlopeWindows.ChiEightNoRealZeroHypothesis Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.MellinRemainder Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.ZetaGrowth Formalism.ZeroFreeRegion.FinalZFR Formalism.ZeroFreeRegion.LogDerivRegion Formalism.LandauZeroFreeBounds.ExceptionalZeroBounds.BqGrowth Formalism.LandauZeroFreeBounds.FinalSiegel Formalism.SizeWindowBrackets.ChainSlopeWindows.AnalyticFirstToLatticeDiscriminant; do
            lake env leanchecker "$module"
            echo "Replayed $module"
          done
          cat >Audit.lean <<'EOF'
          import Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.LogDerivBound
          import Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.ZeroFactor
          import Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.LandauLocalOf
          import Formalism.LandauZeroFreeBounds.ExceptionalZeroBounds.ExistsLocalZeroExpansionOfBound
          import Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.ThreeFourOne
          import Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.ZeroFreeOf
          import Formalism.LandauZeroFreeBounds.ExceptionalZeroBounds.ZetaNegReal
          import Formalism.SizeWindowBrackets.ChainSlopeWindows.ChiEightNoRealZeroHypothesis
          import Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.MellinRemainder
          import Formalism.ZeroFreeRegion.ZetaLogDerivativeBounds.ZetaGrowth
          import Formalism.ZeroFreeRegion.FinalZFR
          import Formalism.ZeroFreeRegion.LogDerivRegion
          import Formalism.LandauZeroFreeBounds.ExceptionalZeroBounds.BqGrowth
          import Formalism.LandauZeroFreeBounds.FinalSiegel
          import Formalism.SizeWindowBrackets.ChainSlopeWindows.AnalyticFirstToLatticeDiscriminant
          import Lean.Util.CollectAxioms
          open Lean in
          run_cmd do
            let allowed := #[`propext, `Classical.choice, `Quot.sound]
            for decl in #[`Formalism.ZF.zeroFreeRegion, `Formalism.ZF.landauLocal, `Formalism.ZF.growthBound,
                `Formalism.ZeroFreeDirichlet.zeta_negative_real_axis,
                `Formalism.ZeroFreeDirichlet.exists_localZeroExpansion_of_bound] do
              for axiomName in ← collectAxioms decl do
                unless allowed.contains axiomName do
                  throwError "unexpected axiom {axiomName} for {decl}"
          #print axioms Formalism.ZF.zeroFreeRegion
          #print axioms Formalism.ZF.landauLocal
          #print axioms Formalism.ZeroFreeDirichlet.exists_localZeroExpansion_of_bound
          EOF
          lake env lean Audit.lean
